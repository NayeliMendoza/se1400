<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Request | Élite Sweets 🍰</title>
    <!-- Professional Luxury Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- THE HEADER YOU LOVE -->
    <header class="main-header">
        <div class="brand-container">
            <h1 class="logo-title">Élite Sweets 🍰</h1>
        </div>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="order-page">
        <div class="order-container">
            
            <!-- TITLES & EMOJIS FROM YOUR DESIGN -->
            <div class="form-header">
                <h2>Custom Order Request 🧁✨</h2>
                <p>We can't wait to bake for you! Required fields are marked with (*).</p>
            </div>

            <!-- THE PROFESSIONAL INFORMATION SQUARE -->
            <div class="form-card">
                <form action="https://flitchbeta.com" method="POST">
                    
                    <!-- Names Row -->
                    <div class="form-row">
                        <div class="input-group">
                            <label>👤 * First Name:</label>
                            <input type="text" name="fName" placeholder="Your lovely name" required>
                        </div>
                        <div class="input-group">
                            <label>🍰 * Last Name:</label>
                            <input type="text" name="lName" placeholder="Your last name" required>
                        </div>
                    </div>

                    <!-- Contact Row -->
                    <div class="form-row">
                        <div class="input-group">
                            <label>💌 * E-mail:</label>
                            <input type="email" name="email" placeholder="hello@sweetness.com" required>
                        </div>
                        <div class="input-group">
                            <label>📞 Phone:</label>
                            <input type="tel" name="phone" placeholder="(435) 000-0000">
                        </div>
                    </div>

                    <!-- Pickup Row -->
                    <div class="form-row">
                        <div class="input-group">
                            <label>📅 * Pickup Date:</label>
                            <input type="date" name="pickupDate" required>
                        </div>
                        <div class="input-group">
                            <label>⏰ * Pickup Time:</label>
                            <input type="time" name="pickupTime" required>
                        </div>
                    </div>

                    <!-- Message Row -->
                    <div class="input-group full-width">
                        <label>🍓 * What can I bake for you?:</label>
                        <textarea name="comments" rows="5" placeholder="Ex: I'd love a dozen hand-filled éclairs and a signature crème brûlée!" required></textarea>
                    </div>

                    <div class="button-container">
                        <button type="submit" class="submit-btn">Submit Order Request 💕</button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Élite Sweets | Professional Grade • Handcrafted at Home 💕</p>
    </footer>

</body>
</html>
